<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiaryCalendar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- 左サイドバー -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>メニュー</h3>
      </div>
      <div class="sidebar-menu">
        <button id="quick-habits-btn" class="menu-btn">
          <span class="menu-icon">🎯</span>
          <span class="menu-label">習慣</span>
        </button>
        <button id="manage-habits-btn" class="menu-btn">
          <span class="menu-icon">⚙️</span>
          <span class="menu-label">習慣を管理</span>
        </button>
      </div>
    </div>

    <!-- メインエリア（カレンダー） -->
    <div class="main-area">
      <div class="calendar-container">
        <!-- クイック習慣ボタン -->
        <div class="quick-buttons">
          <button id="quick-btn-0" class="quick-btn">
            <span class="quick-btn-emoji"></span>
          </button>
          <button id="quick-btn-1" class="quick-btn">
            <span class="quick-btn-emoji"></span>
          </button>
          <button id="quick-btn-2" class="quick-btn">
            <span class="quick-btn-emoji"></span>
          </button>
          <button id="quick-btn-3" class="quick-btn">
            <span class="quick-btn-emoji"></span>
          </button>
        </div>

        <div class="calendar-header">
          <button id="prev-month" class="nav-btn">&lt;</button>
          <h2 id="current-month"></h2>
          <button id="next-month" class="nav-btn">&gt;</button>
        </div>
        <div class="calendar-weekdays">
          <div class="weekday sunday">日</div>
          <div class="weekday">月</div>
          <div class="weekday">火</div>
          <div class="weekday">水</div>
          <div class="weekday">木</div>
          <div class="weekday">金</div>
          <div class="weekday saturday">土</div>
        </div>
        <div id="calendar-days" class="calendar-days">
          <!-- 日付はJavaScriptで動的に生成 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 習慣選択ポップアップ -->
  <div id="popup-overlay" class="popup-overlay">
    <div class="popup">
      <div class="popup-header">
        <h3 id="popup-date"></h3>
        <button id="popup-close" class="popup-close">&times;</button>
      </div>
      <div id="habit-list" class="habit-list">
        <!-- 習慣リストはJavaScriptで生成 -->
      </div>
    </div>
  </div>

  <!-- 習慣管理モーダル -->
  <div id="manage-modal-overlay" class="popup-overlay">
    <div class="popup manage-popup">
      <div class="popup-header">
        <h3>習慣を管理</h3>
        <button id="manage-modal-close" class="popup-close">&times;</button>
      </div>
      <div class="manage-content">
        <div id="manage-habit-list" class="manage-habit-list">
          <!-- 習慣リストはJavaScriptで生成 -->
        </div>
        <button id="add-habit-btn" class="add-habit-btn">
          <span>＋</span> 新しい習慣を追加
        </button>
      </div>
    </div>
  </div>

  <!-- クイック習慣設定モーダル -->
  <div id="quick-habits-modal-overlay" class="popup-overlay">
    <div class="popup manage-popup">
      <div class="popup-header">
        <h3>習慣（クイックボタン）</h3>
        <button id="quick-habits-modal-close" class="popup-close">&times;</button>
      </div>
      <div class="manage-content">
        <p class="quick-habits-description">上部の4つのボタンに表示する習慣を設定します。<br>ボタンを押すと今日の日付に習慣が登録されます。</p>
        <div id="quick-habit-list" class="manage-habit-list">
          <!-- 習慣リストはJavaScriptで生成 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 絵文字選択モーダル -->
  <div id="emoji-modal-overlay" class="popup-overlay">
    <div class="popup emoji-popup">
      <div class="popup-header">
        <h3>アイコンを選択</h3>
        <button id="emoji-modal-close" class="popup-close">&times;</button>
      </div>
      <!-- カテゴリタブ -->
      <div class="emoji-tabs">
        <button class="emoji-tab active" data-category="activity">運動</button>
        <button class="emoji-tab" data-category="study">学習</button>
        <button class="emoji-tab" data-category="life">生活</button>
        <button class="emoji-tab" data-category="hobby">趣味</button>
        <button class="emoji-tab" data-category="other">その他</button>
        <button class="emoji-tab" data-category="custom">カスタム</button>
      </div>
      <div id="emoji-grid" class="emoji-grid">
        <!-- 絵文字はJavaScriptで生成 -->
      </div>
      <!-- 画像アップロード -->
      <div id="custom-image-section" class="custom-image-section" style="display: none;">
        <input type="file" id="image-upload" accept="image/*" style="display: none;">
        <button id="upload-image-btn" class="upload-image-btn">
          <span>📁</span> 画像をアップロード
        </button>
        <p class="upload-hint">※ 画像は正方形に切り取られます</p>
      </div>
    </div>
  </div>

  <!-- 削除確認モーダル -->
  <div id="confirm-modal-overlay" class="popup-overlay">
    <div class="popup confirm-popup">
      <div class="popup-header">
        <h3>確認</h3>
        <button id="confirm-modal-close" class="popup-close">&times;</button>
      </div>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="confirm-buttons">
        <button id="confirm-cancel" class="confirm-btn cancel">キャンセル</button>
        <button id="confirm-ok" class="confirm-btn danger">削除する</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
